<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <style>
      .title { font: bold 20px Arial; fill: #333; }
      .label { font: 12px Arial; fill: #333; }
      .sublabel { font: 10px Arial; fill: #666; }
      .box { rx: 6; ry: 6; }
      .arrow { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 5,5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <rect width="1000" height="800" fill="#fafafa"/>
  <text x="500" y="35" class="title" text-anchor="middle">Module Dependency Diagram</text>

  <!-- Startup Layer -->
  <rect x="400" y="60" width="200" height="60" class="box" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="500" y="85" class="label" text-anchor="middle" font-weight="bold">gateway-bootstrap</text>
  <text x="500" y="100" class="sublabel" text-anchor="middle">Spring Boot Entry</text>

  <line x1="500" y1="120" x2="500" y2="150" class="arrow"/>

  <!-- Core Layer -->
  <rect x="300" y="150" width="400" height="70" class="box" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="500" y="180" class="label" text-anchor="middle" font-weight="bold">gateway-core</text>
  <text x="500" y="195" class="sublabel" text-anchor="middle">Filters / Route Engine / Protocol / Security</text>

  <!-- Business Layer -->
  <rect x="50" y="280" width="900" height="200" class="box" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" opacity="0.3"/>
  <text x="500" y="305" class="label" text-anchor="middle" fill="#2e7d32" font-weight="bold">Business Layer</text>

  <rect x="80" y="320" width="180" height="60" class="box" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="170" y="345" class="label" text-anchor="middle" font-weight="bold">gateway-registry</text>
  <text x="170" y="360" class="sublabel" text-anchor="middle">Service Registration</text>

  <rect x="280" y="320" width="180" height="60" class="box" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="370" y="345" class="label" text-anchor="middle" font-weight="bold">gateway-router</text>
  <text x="370" y="360" class="sublabel" text-anchor="middle">Static/Semantic Routing</text>

  <rect x="480" y="320" width="180" height="60" class="box" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="570" y="345" class="label" text-anchor="middle" font-weight="bold">gateway-security</text>
  <text x="570" y="360" class="sublabel" text-anchor="middle">OAuth2/JWT/RBAC</text>

  <rect x="680" y="320" width="180" height="60" class="box" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="770" y="345" class="label" text-anchor="middle" font-weight="bold">gateway-admin</text>
  <text x="770" y="360" class="sublabel" text-anchor="middle">Admin Console Backend</text>

  <!-- Arrows from Core to Business -->
  <line x1="400" y1="220" x2="170" y2="320" class="arrow"/>
  <line x1="450" y1="220" x2="370" y2="320" class="arrow"/>
  <line x1="550" y1="220" x2="570" y2="320" class="arrow"/>
  <line x1="600" y1="220" x2="770" y2="320" class="arrow"/>

  <!-- Common Layer -->
  <rect x="300" y="520" width="400" height="60" class="box" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="500" y="545" class="label" text-anchor="middle" font-weight="bold">gateway-common</text>
  <text x="500" y="560" class="sublabel" text-anchor="middle">Data Model / Exceptions / Utilities</text>

  <!-- Arrows to Common -->
  <line x1="170" y1="380" x2="350" y2="520" class="arrow"/>
  <line x1="370" y1="380" x2="400" y2="520" class="arrow"/>
  <line x1="570" y1="380" x2="500" y2="520" class="arrow"/>
  <line x1="770" y1="380" x2="650" y2="520" class="arrow"/>
  <line x1="500" y1="220" x2="500" y2="520" class="arrow"/>

  <!-- Frontend Layer -->
  <rect x="700" y="620" width="200" height="60" class="box" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="800" y="645" class="label" text-anchor="middle" font-weight="bold">gateway-console</text>
  <text x="800" y="660" class="sublabel" text-anchor="middle">Vue 3 + Element Plus</text>

  <!-- Dashed arrow from Console to Admin -->
  <line x1="770" y1="380" x2="800" y2="620" class="arrow dashed"/>

  <!-- Infrastructure Dependencies -->
  <rect x="50" y="700" width="900" height="80" class="box" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
  <text x="500" y="725" class="label" text-anchor="middle" fill="#37474f" font-weight="bold">Infrastructure Dependencies</text>

  <rect x="80" y="735" width="120" height="35" class="box" fill="#b3e5fc" stroke="#0277bd"/>
  <text x="140" y="757" class="sublabel" text-anchor="middle">Nacos</text>

  <rect x="220" y="735" width="120" height="35" class="box" fill="#e1bee7" stroke="#7b1fa2"/>
  <text x="280" y="757" class="sublabel" text-anchor="middle">Milvus</text>

  <rect x="360" y="735" width="120" height="35" class="box" fill="#ffcdd2" stroke="#c62828"/>
  <text x="420" y="757" class="sublabel" text-anchor="middle">Redis</text>

  <rect x="500" y="735" width="120" height="35" class="box" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="560" y="757" class="sublabel" text-anchor="middle">MySQL</text>

  <rect x="640" y="735" width="120" height="35" class="box" fill="#fff9c4" stroke="#f57f17"/>
  <text x="700" y="757" class="sublabel" text-anchor="middle">RocketMQ</text>

  <!-- Arrows to Infrastructure -->
  <line x1="170" y1="380" x2="140" y2="735" class="arrow dashed"/>
  <line x1="370" y1="380" x2="280" y2="735" class="arrow dashed"/>
  <line x1="400" y1="220" x2="420" y2="735" class="arrow dashed"/>
  <line x1="770" y1="380" x2="560" y2="735" class="arrow dashed"/>
  <line x1="170" y1="380" x2="700" y2="735" class="arrow dashed"/>
</svg>