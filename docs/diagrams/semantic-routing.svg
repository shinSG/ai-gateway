<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200">
  <defs>
    <style>
      .title { font: bold 20px Arial; fill: #333; }
      .label { font: 12px Arial; fill: #333; }
      .sublabel { font: 10px Arial; fill: #666; }
      .box { rx: 6; ry: 6; }
      .arrow { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 5,5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <rect width="1000" height="1200" fill="#fafafa"/>
  <text x="500" y="35" class="title" text-anchor="middle">Semantic Routing Flow</text>

  <!-- Start -->
  <rect x="400" y="60" width="200" height="50" class="box" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="500" y="90" class="label" text-anchor="middle">Receive Request</text>

  <line x1="500" y1="110" x2="500" y2="140" class="arrow"/>

  <!-- Phase 1: Static Route Check -->
  <rect x="100" y="140" width="800" height="100" class="box" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" opacity="0.3"/>
  <text x="500" y="165" class="label" text-anchor="middle" fill="#2e7d32" font-weight="bold">Phase 1: Static Route Check</text>

  <rect x="350" y="180" width="300" height="40" class="box" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="500" y="205" class="label" text-anchor="middle">Path / Header / Query Match?</text>

  <line x1="500" y1="220" x2="500" y2="240" class="arrow"/>

  <!-- Phase 2: Semantic Analysis -->
  <rect x="100" y="240" width="800" height="140" class="box" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" opacity="0.3"/>
  <text x="500" y="265" class="label" text-anchor="middle" fill="#6a1b9a" font-weight="bold">Phase 2: Semantic Analysis</text>

  <rect x="350" y="280" width="300" height="40" class="box" fill="#e1bee7" stroke="#6a1b9a"/>
  <text x="500" y="305" class="label" text-anchor="middle">Build Request Text</text>

  <rect x="350" y="330" width="300" height="40" class="box" fill="#ce93d8" stroke="#6a1b9a"/>
  <text x="500" y="355" class="label" text-anchor="middle">Embedding Service: Generate Vector</text>

  <line x1="500" y1="370" x2="500" y2="390" class="arrow"/>

  <!-- Phase 3: Vector Search -->
  <rect x="100" y="390" width="800" height="100" class="box" fill="#fff3e0" stroke="#e65100" stroke-width="2" opacity="0.3"/>
  <text x="500" y="415" class="label" text-anchor="middle" fill="#e65100" font-weight="bold">Phase 3: Vector Search</text>

  <rect x="350" y="430" width="300" height="40" class="box" fill="#ffe0b2" stroke="#e65100"/>
  <text x="500" y="455" class="label" text-anchor="middle">Milvus: Top-K Similar Services</text>

  <line x1="500" y1="470" x2="500" y2="490" class="arrow"/>

  <!-- Phase 4: Candidate Filtering -->
  <rect x="100" y="490" width="800" height="100" class="box" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" opacity="0.3"/>
  <text x="500" y="515" class="label" text-anchor="middle" fill="#1565c0" font-weight="bold">Phase 4: Candidate Filtering</text>

  <rect x="350" y="530" width="300" height="40" class="box" fill="#bbdefb" stroke="#1565c0"/>
  <text x="500" y="555" class="label" text-anchor="middle">Filter UP Status Services</text>

  <line x1="500" y1="570" x2="500" y2="590" class="arrow"/>

  <!-- Decision: Candidates > 0? -->
  <polygon points="500,590 600,630 500,670 400,630" fill="#fff9c4" stroke="#f57f17" stroke-width="2"/>
  <text x="500" y="635" class="label" text-anchor="middle">Candidates > 0?</text>

  <!-- No: Fallback -->
  <line x1="400" y1="630" x2="200" y2="630" class="arrow"/>
  <text x="300" y="620" class="sublabel" text-anchor="middle">No</text>

  <rect x="100" y="610" width="150" height="40" class="box" fill="#ffcdd2" stroke="#c62828"/>
  <text x="175" y="635" class="label" text-anchor="middle">Fallback to Default</text>

  <line x1="175" y1="650" x2="175" y2="1050" class="arrow dashed"/>

  <!-- Yes: Load Balancing -->
  <line x1="500" y1="670" x2="500" y2="700" class="arrow"/>
  <text x="520" y="690" class="sublabel">Yes</text>

  <!-- Phase 5: Load Balancing Strategy -->
  <rect x="100" y="700" width="800" height="200" class="box" fill="#e1f5fe" stroke="#0277bd" stroke-width="2" opacity="0.3"/>
  <text x="500" y="725" class="label" text-anchor="middle" fill="#0277bd" font-weight="bold">Phase 5: Load Balancing Strategy</text>

  <rect x="350" y="740" width="300" height="40" class="box" fill="#81d4fa" stroke="#0277bd"/>
  <text x="500" y="765" class="label" text-anchor="middle">Select Strategy</text>

  <rect x="100" y="800" width="120" height="35" class="box" fill="#4fc3f7" stroke="#0277bd"/>
  <text x="160" y="822" class="sublabel" text-anchor="middle">Round Robin</text>

  <rect x="240" y="800" width="120" height="35" class="box" fill="#4fc3f7" stroke="#0277bd"/>
  <text x="300" y="822" class="sublabel" text-anchor="middle">Weighted</text>

  <rect x="380" y="800" width="120" height="35" class="box" fill="#4fc3f7" stroke="#0277bd"/>
  <text x="440" y="822" class="sublabel" text-anchor="middle">Least Conn</text>

  <rect x="520" y="800" width="120" height="35" class="box" fill="#4fc3f7" stroke="#0277bd"/>
  <text x="580" y="822" class="sublabel" text-anchor="middle">Capability</text>

  <rect x="660" y="800" width="120" height="35" class="box" fill="#4fc3f7" stroke="#0277bd"/>
  <text x="720" y="822" class="sublabel" text-anchor="middle">Cost Optimized</text>

  <rect x="800" y="800" width="100" height="35" class="box" fill="#4fc3f7" stroke="#0277bd"/>
  <text x="850" y="822" class="sublabel" text-anchor="middle">Latency</text>

  <line x1="500" y1="840" x2="500" y2="870" class="arrow"/>

  <!-- Phase 6: Route Decision -->
  <rect x="100" y="870" width="800" height="80" class="box" fill="#fce4ec" stroke="#c62828" stroke-width="2" opacity="0.3"/>
  <text x="500" y="895" class="label" text-anchor="middle" fill="#c62828" font-weight="bold">Phase 6: Route Decision</text>

  <rect x="350" y="910" width="300" height="30" class="box" fill="#f8bbd0" stroke="#c62828"/>
  <text x="500" y="930" class="label" text-anchor="middle">Target Service + Instance Address</text>

  <line x1="500" y1="950" x2="500" y2="980" class="arrow"/>

  <!-- Forward Request -->
  <rect x="350" y="980" width="300" height="50" class="box" fill="#b2dfdb" stroke="#00695c" stroke-width="2"/>
  <text x="500" y="1010" class="label" text-anchor="middle">Forward Request</text>

  <line x1="500" y1="1030" x2="500" y2="1050" class="arrow"/>

  <!-- AI Service Processing -->
  <rect x="350" y="1050" width="300" height="50" class="box" fill="#dcedc8" stroke="#33691e" stroke-width="2"/>
  <text x="500" y="1080" class="label" text-anchor="middle">AI Service Processing</text>

  <line x1="500" y1="1100" x2="500" y2="1130" class="arrow"/>

  <!-- Return Response -->
  <rect x="350" y="1130" width="300" height="50" class="box" fill="#b2dfdb" stroke="#00695c" stroke-width="2"/>
  <text x="500" y="1160" class="label" text-anchor="middle">Return Response</text>
</svg>